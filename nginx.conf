# Nginx configuration for Next.js static export with trailingSlash
# Place this in your Nginx server block

server {
    listen 80;
    server_name kabonshare.com www.kabonshare.com;
    
    root /var/www/kabonshare_landing/out;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Handle trailing slashes - redirect to trailing slash
    rewrite ^([^.]*[^/])$ $1/ permanent;

    # Serve static files directly
    location /_next/static/ {
        alias /var/www/kabonshare_landing/out/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve other static assets
    location /static/ {
        alias /var/www/kabonshare_landing/out/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Try files with trailing slash and index.html
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Handle 404 errors
    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
