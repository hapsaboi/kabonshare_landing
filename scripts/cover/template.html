<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog cover</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /*
   * Blog cover template — 1200x675 (16:9), the ratio PostCard crops to and the
   * size social previews want.
   *
   * A template rather than a generated illustration per post: eight prompts
   * produce eight subtly different styles, and a blog then reads as assembled
   * rather than designed. Only the words and the accent hue change here, so
   * covers stay recognisably the same family however many are published.
   *
   * Values are the site's own tokens (tailwind.config.js), not approximations.
   */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #667eea;
    --secondary: #764ba2;
    --dark: #0f172a;
    --accent: var(--primary);   /* overridden per category */
  }

  body {
    width: 1200px; height: 675px;
    background: var(--dark);
    font-family: 'Inter', system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
  }

  /* Two soft blooms, echoing the gradient used across the site. Placed off the
     edges so object-cover can trim without losing anything. */
  .bloom {
    position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: .55; pointer-events: none;
  }
  .bloom-a { width: 620px; height: 620px; background: var(--accent); top: -260px; left: -180px; }
  .bloom-b { width: 560px; height: 560px; background: var(--secondary); bottom: -300px; right: -140px; opacity: .45; }

  /* Faint grid — structure without decoration, and it survives the crop. */
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at 30% 40%, #000 20%, transparent 78%);
  }

  .frame {
    position: relative; height: 100%;
    /* Generous side padding: object-cover trims the edges on narrow cards. */
    padding: 76px 104px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 15px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase;
    color: rgba(255,255,255,.62);
  }
  .eyebrow::before {
    content: ''; width: 26px; height: 2px; border-radius: 2px;
    background: var(--accent);
  }

  h1 {
    font-family: 'Bricolage Grotesque', 'Inter', sans-serif;
    font-weight: 600;
    font-size: 66px;
    line-height: 1.08;
    letter-spacing: -.028em;
    max-width: 17ch;          /* forces a 2–3 line shape, the most legible */
    text-wrap: balance;
  }
  /* Longer titles step down rather than overflowing. */
  h1.long  { font-size: 56px; max-width: 19ch; }
  h1.xlong { font-size: 48px; max-width: 22ch; }

  .foot {
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand {
    display: flex; align-items: center; gap: 13px;
    font-size: 19px; font-weight: 600; letter-spacing: -.01em;
  }
  .mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    box-shadow: 0 6px 18px rgba(102,126,234,.42);
  }
  .read { font-size: 16px; color: rgba(255,255,255,.44); }
</style>
</head>
<body>
  <div class="bloom bloom-a"></div>
  <div class="bloom bloom-b"></div>
  <div class="grid"></div>

  <div class="frame">
    <div class="eyebrow" id="eyebrow">GUIDES</div>
    <h1 id="title">Schedule a month of content in one sitting</h1>
    <div class="foot">
      <div class="brand"><div class="mark"></div>KabonShare</div>
      <div class="read" id="read">7 min read</div>
    </div>
  </div>

  <script>
    // ?title=...&eyebrow=...&read=...&accent=#hex
    const q = new URLSearchParams(location.search);
    const title = q.get('title');
    if (title) document.getElementById('title').textContent = title;
    if (q.get('eyebrow')) document.getElementById('eyebrow').textContent = q.get('eyebrow').toUpperCase();
    if (q.get('read')) document.getElementById('read').textContent = q.get('read');
    if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));

    // Step the type down by length rather than letting a long title overflow
    // or shrink to something unreadable.
    const h = document.getElementById('title');
    const len = h.textContent.length;
    if (len > 64) h.classList.add('xlong');
    else if (len > 42) h.classList.add('long');
  </script>
</body>
</html>
